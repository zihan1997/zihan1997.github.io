    <script>
      (function(){
        const CONFIG = {
          password: 'MrBigNB',
          verifyOnLocal: false,
          maxAttempts: 3,
          redirectUrl: 'about:blank'
        };
  
        function isLocalhost(hostname) {
          return hostname === 'localhost' || 
                 hostname === '127.0.0.1' || 
                 hostname === '::1' || 
                 hostname.startsWith('192');
        }
  
        function redirectBack() {
          if (history.length > 1) {
            history.back();
          } else {
            window.location.href = CONFIG.redirectUrl;
          }
        }
  
        function verifyPassword() {
          let attempts = 0;
          const hostname = window.location.hostname;
  
          // Skip verification on localhost unless explicitly enabled
          if (!CONFIG.verifyOnLocal && isLocalhost(hostname)) {
            return;
          }
  
          while (attempts < CONFIG.maxAttempts) {
            const password = prompt('Please enter password to access this page');
            
            // Handle cancel button
            if (password === null) {
              redirectBack();
              return;
            }
  
            // Check password
            if (password.trim() === CONFIG.password) {
              return;
            }
  
            attempts++;
            alert(`Incorrect password. ${CONFIG.maxAttempts - attempts} attempts remaining.`);
          }
  
          // Max attempts reached
          alert('Maximum password attempts exceeded.');
          redirectBack();
        }
  
        // Execute verification
        verifyPassword();
      })();
      </script>
